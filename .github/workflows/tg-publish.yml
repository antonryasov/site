name: Опубликовать пост в Telegram

# Каждый день в 20:00 по Москве берёт из очереди (telegram/очередь.json) посты,
# у которых наступил publish_after, публикует в канал, обновляет живую ленту
# на странице #/telegram и коммитит изменения.
#
# Серия: 50 постов, по одному в день, 09.11.2026 → 28.12.2026.
# Первые пять постов идут без даты — они уходят при первом запуске (сразу все пять).
#
# Нужен секрет репозитория TG_BOT_TOKEN: Settings → Secrets and variables → Actions → New repository secret.
# Как получить токен и подключить бота к каналу — telegram/КАК-ПУБЛИКОВАТЬ.md
# Запустить вручную: Actions → «Опубликовать пост в Telegram» → Run workflow.
# GitHub может задержать запуск по расписанию на 5–20 минут — это нормально.
# Пропущенный день не теряется: следующий запуск опубликует всё, что уже пора.

on:
  schedule:
    - cron: '0 17 * * *'   # 20:00 по Москве (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверить и опубликовать
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "Секрет TG_BOT_TOKEN не задан — публикация пропущена."
            echo "Инструкция: telegram/КАК-ПУБЛИКОВАТЬ.md"
            exit 0
          fi
          python3 tg-publish.py --check || true
          python3 tg-publish.py --next

      - name: Обновить живую ленту на сайте
        run: python3 tg-feed.py --patch index.html || echo "Лента не обновилась — на публикацию это не влияет"

      - name: Закоммитить очередь и ленту
        run: |
          if git diff --quiet; then
            echo "Изменений нет — коммит не нужен."
            exit 0
          fi
          git config user.name "tg-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html telegram/очередь.json
          git commit -m "Telegram: публикация поста и обновление ленты"
          git push
